name: lcstats_relay
description: LCStats Relay
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.1.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flet: 1.0.4
  serious_python: 5.0.0
  msgpack_dart: ^1.0.1
  package_info_plus: ^9.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  window_manager: ^0.5.1
  flet_secure_storage:
    path: ../../.venv/Lib/site-packages/flutter/flet_secure_storage
dependency_overrides:
  flet: 1.0.4
  serious_python_platform_interface: 5.0.0
  serious_python_windows: 5.0.0
  serious_python_linux: 5.0.0
  serious_python_darwin: 5.0.0
  serious_python_android: 5.0.0
dev_dependencies:
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
