name: Pull Request

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    # Source checks run on the lightweight, unprivileged runner and remain
    # separate from the test job for a focused PR failure signal.
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint source
        uses: ./.github/actions/check-python-flet-source

  test:
    name: Test
    # Unit tests use the locked Python environment without desktop packaging or
    # privileged services, so this job fits the slim runner contract.
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test source
        uses: ./.github/actions/test-python-flet-source
