name: Build Flet desktop artifact
description: Build and verify a reviewed native desktop release profile.

inputs:
  target:
    description: Supported target (windows-amd64, linux-amd64 or linux-arm64).
    required: true
  build_number:
    description: Monotonic build number passed to Flet.
    required: true
  output_directory:
    description: Directory receiving the packaged artifact.
    default: dist

outputs:
  project_version:
    description: Canonical SemVer release version.
    value: ${{ steps.version.outputs.project_version }}
  git_version:
    description: Canonical release tag.
    value: ${{ steps.version.outputs.git_version }}
  release_mode:
    description: latest, prerelease, or edge.
    value: ${{ steps.version.outputs.release_mode }}
  artifact_name:
    description: Packaged artifact filename.
    value: ${{ steps.windows.outputs.name || steps.linux.outputs.name }}
  artifact_path:
    description: Repository-relative artifact path.
    value: ${{ steps.windows.outputs.path || steps.linux.outputs.path }}

runs:
  using: composite
  steps:
    - name: Set up locked Python environment
      uses: ./.github/actions/setup-python-locked

    - name: Generate version metadata
      id: version
      uses: ./.github/actions/generate-version

    - name: Build and verify Windows x64 binary
      if: inputs.target == 'windows-amd64'
      id: windows
      shell: pwsh
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        TARGET: ${{ inputs.target }}
        OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
        PROJECT_VERSION: ${{ steps.version.outputs.project_version }}
        BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        BUILD_NUMBER: ${{ inputs.build_number }}
        FLET_CLI_NO_RICH_OUTPUT: "1"
      run: |
        if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64" -or $env:TARGET -ne "windows-amd64") {
          throw "Windows amd64 requires the reviewed Windows runner"
        }
        & (Join-Path $env:ACTION_DIRECTORY "build-windows.ps1") `
          -Version $env:PROJECT_VERSION -BuildVersion $env:BUILD_VERSION `
          -BuildNumber $env:BUILD_NUMBER -OutputDirectory $env:OUTPUT_DIRECTORY
        $name = "lcstats-relay-v$($env:PROJECT_VERSION)-windows-amd64.zip"
        "name=$name" >> $env:GITHUB_OUTPUT
        "path=$($env:OUTPUT_DIRECTORY)/$name" >> $env:GITHUB_OUTPUT

    - name: Build and verify Linux binary
      if: startsWith(inputs.target, 'linux-')
      id: linux
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PROJECT_VERSION: ${{ steps.version.outputs.project_version }}
        BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        BUILD_NUMBER: ${{ inputs.build_number }}
        OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
        FLET_CLI_NO_RICH_OUTPUT: "1"
      run: |
        [[ "$RUNNER_OS" == "Linux" ]]
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) exit 1 ;;
        esac
        [[ "$TARGET" == "linux-$arch" ]]
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          clang cmake ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev \
          libsecret-1-dev libjsoncpp-dev xvfb xauth dbus-x11 gnome-keyring \
          libgl1-mesa-dri libglx-mesa0
        bash .github/actions/build-desktop/build-linux.sh \
          "$PROJECT_VERSION" "$BUILD_VERSION" "$BUILD_NUMBER" "$OUTPUT_DIRECTORY"
        name="lcstats-relay-v${PROJECT_VERSION}-$TARGET.tar.gz"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "path=$OUTPUT_DIRECTORY/$name" >> "$GITHUB_OUTPUT"
